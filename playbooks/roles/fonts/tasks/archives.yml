  ansible.builtin.uri:
    url: https://api.github.com/repos/yuru7/HackGen/releases/latest
    return_content: true
  register: fonts_hackgen_release_lookup
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - fonts_install_hackgen | bool
    - fonts_hackgen_version is not defined
