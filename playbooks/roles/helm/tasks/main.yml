---
- name: Check installed helm version
  ansible.builtin.command: helm version --short
  register: helm_installed_version
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts['system'] != 'Darwin'

- name: Install the pinned helm release
  vars:
    helm_download_dir: "{{ ansible_facts['user_dir'] }}/.cache/ansible/helm-download"
  when:
    - ansible_facts['system'] != 'Darwin'
    - helm_version not in (helm_installed_version.stdout | default(''))
  block:
    - name: Create the helm download directory
      ansible.builtin.file:
        path: "{{ helm_download_dir }}"
        state: directory
        mode: "0700"
      check_mode: false

    - name: Download helm release archive
      ansible.builtin.get_url:
        url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
        dest: "{{ helm_download_dir }}/helm-{{ helm_version }}-linux-amd64.tar.gz"
        checksum: "{{ helm_archive_checksum }}"
        mode: "0644"
      check_mode: false

    - name: Extract helm release archive
      ansible.builtin.unarchive:
        src: "{{ helm_download_dir }}/helm-{{ helm_version }}-linux-amd64.tar.gz"
        dest: "{{ helm_download_dir }}"
        remote_src: true
      check_mode: false

    - name: Install helm binary
      ansible.builtin.copy:
        src: "{{ helm_download_dir }}/linux-amd64/helm"
        dest: "{{ helm_install_dir }}/helm"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: Remove the helm download directory
      ansible.builtin.file:
        path: "{{ helm_download_dir }}"
        state: absent
      check_mode: false

- name: Install helm via Homebrew on macOS
  ansible.builtin.include_tasks:
    file: mac.yml
  when: ansible_facts['system'] == 'Darwin'
