---
- name: Refresh the font cache
  ansible.builtin.command:
    argv:
      - fc-cache
      - -f
      - "{{ fonts_install_dir }}"
  become: true
  changed_when: true

- name: Restore SELinux context for installed fonts
  ansible.builtin.command:
    argv:
      - restorecon
      - -RF
      - "{{ fonts_install_dir }}"
  become: true
  changed_when: true
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - (ansible_facts['selinux'] | default({})).get('status', 'disabled') == 'enabled'
