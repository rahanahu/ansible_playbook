---
- name: Install Docker Engine on Debian-family systems
  when: ansible_os_family == 'Debian'
  block:
    - name: Remove conflicting Docker packages
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-doc
          - docker-compose
          - docker-compose-v2
          - podman-docker
          - containerd
          - runc
        state: absent
        purge: true
      become: true

    - name: Install Docker repository prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true
      become: true

    - name: Ensure apt keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      become: true

    - name: Install Docker apt signing key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ 'ubuntu' if ansible_distribution == 'Ubuntu' else 'debian' }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        force: true
      become: true

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ 'ubuntu' if ansible_distribution == 'Ubuntu' else 'debian' }} {{ ansible_distribution_release }} stable"
        filename: docker
        state: present
      become: true

    - name: Install Docker Engine packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
      become: true

- name: Install Docker Engine on Fedora
  when: ansible_distribution == 'Fedora'
  block:
    - name: Install Docker repository prerequisites
      ansible.builtin.package:
        name:
          - ca-certificates
          - curl
        state: present
      become: true

    - name: Add Docker Fedora repository
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/fedora/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo
        mode: "0644"
      become: true

    - name: Install Docker Engine packages
      ansible.builtin.package:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
      become: true

- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present
  become: true
  when: ansible_os_family == 'Debian' or ansible_distribution == 'Fedora'

- name: Ensure current user is in docker group
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: true
  become: true
  when: ansible_os_family == 'Debian' or ansible_distribution == 'Fedora'

- name: Ensure docker service is enabled and running
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
  become: true
  when: ansible_os_family == 'Debian' or ansible_distribution == 'Fedora'
