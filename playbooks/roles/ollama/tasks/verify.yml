---
- name: Explain why the Ollama smoke test is skipped in check mode
  ansible.builtin.debug:
    msg: >-
      Skipping the Ollama smoke test in check mode because check mode
      cannot install the binary or run the service.
  when:
    - ansible_check_mode
    - ollama_run_smoke_test | bool

- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: rpm
  when:
    - not ansible_check_mode
    - ollama_run_smoke_test | bool

- name: Confirm the Fedora ollama package is not installed
  ansible.builtin.assert:
    that:
      - "'ollama' not in (ansible_facts.packages | default({}))"
    fail_msg: >-
      The Fedora `ollama` package is still present. This role installs
      Ollama from the upstream release binary and expects the RPM to have
      been removed by tasks/packages.yml.
  when:
    - not ansible_check_mode
    - ollama_run_smoke_test | bool

- name: Check the installed Ollama binary and library directory
  ansible.builtin.stat:
    path: "{{ item }}"
  register: ollama_verify_paths
  loop:
    - "{{ ollama_install_bin }}"
    - "{{ ollama_install_lib_dir }}"
  check_mode: false
  when:
    - not ansible_check_mode
    - ollama_run_smoke_test | bool

- name: Confirm the Ollama binary and library directory exist
  ansible.builtin.assert:
    that:
      - >-
        (ollama_verify_paths.results
         | selectattr('item', 'equalto', ollama_install_bin) | first)
        .stat.exists
      - >-
        (ollama_verify_paths.results
         | selectattr('item', 'equalto', ollama_install_bin) | first)
        .stat.executable
      - >-
        (ollama_verify_paths.results
         | selectattr('item', 'equalto', ollama_install_lib_dir) | first)
        .stat.isdir
    fail_msg: >-
      {{ ollama_install_bin }} is not an executable file, and/or
      {{ ollama_install_lib_dir }} is not a directory.
  when:
    - not ansible_check_mode
    - ollama_run_smoke_test | bool

# Upstream names the ROCm subdirectory with an embedded version, e.g.
# rocm_v7_2, not a fixed "rocm", so the directory name is matched with a
# glob rather than hard-coded. This is an independent re-check of runtime
# state, not a re-use of tasks/install.yml's own find result.
- name: Check for an installed ROCm library directory
  ansible.builtin.find:
    paths: "{{ ollama_install_lib_dir }}"
    patterns: "rocm*"
    file_type: directory
  register: ollama_verify_rocm_dirs
  check_mode: false
  when:
    - not ansible_check_mode
    - ollama_run_smoke_test | bool
    - ollama_install_rocm | bool

- name: Confirm a ROCm library directory is installed
  ansible.builtin.assert:
    that:
      - (ollama_verify_rocm_dirs.matched | default(0) | int) > 0
    fail_msg: >-
      No rocm* directory was found under {{ ollama_install_lib_dir }}, even
      though ollama_install_rocm is true. Without it, Ollama silently falls
      back to CPU-only inference instead of failing loudly. Confirm the
      actual GPU backend selection from `journalctl -u {{ ollama_service }}`
      (the "inference compute" line reports `library=ROCm` when the GPU
      backend was selected); this check only confirms the library directory
      exists, not that inference is using the GPU.
  when:
    - not ansible_check_mode
    - ollama_run_smoke_test | bool
    - ollama_install_rocm | bool

- name: Read the installed Ollama binary version
  ansible.builtin.command:
    argv:
      - "{{ ollama_install_bin }}"
      - --version
  register: ollama_verify_version_raw
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - not ansible_check_mode
    - ollama_run_smoke_test | bool

# See tasks/install.yml for why both output shapes must be handled and why
# the client line (the actual installed binary version) is preferred over
# the "ollama version is" line when both are present.
- name: Record the installed Ollama binary version from each possible output shape
  ansible.builtin.set_fact:
    ollama_verify_version_client: >-
      {{ (ollama_verify_version_raw.stdout | default(''))
         | regex_search('[Cc]lient version is (\S+)', '\1')
         | default([''], true) | first }}
    ollama_verify_version_connected: >-
      {{ (ollama_verify_version_raw.stdout | default(''))
         | regex_search('ollama version is (\S+)', '\1')
         | default([''], true) | first }}
  changed_when: false
  when:
    - not ansible_check_mode
    - ollama_run_smoke_test | bool

- name: Resolve the installed Ollama binary version
  ansible.builtin.set_fact:
    ollama_verify_version: >-
      {{ ollama_verify_version_client
         if (ollama_verify_version_client | length > 0)
         else ollama_verify_version_connected }}
  changed_when: false
  when:
    - not ansible_check_mode
    - ollama_run_smoke_test | bool

- name: Confirm the installed Ollama binary reports the desired version
  ansible.builtin.assert:
    that:
      - ollama_verify_version == ollama_desired_version
      - ollama_verify_version != '0.0.0'
    fail_msg: >-
      `{{ ollama_install_bin }} --version` reported
      "{{ ollama_verify_version }}", which does not match the desired
      version {{ ollama_desired_version }}.
  when:
    - not ansible_check_mode
    - ollama_run_smoke_test | bool

- name: Read the effective Ollama environment
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - "{{ ollama_service }}"
      - --property=Environment
      - --property=SupplementaryGroups
  become: true
  register: ollama_effective_environment
  changed_when: false
  check_mode: false
  when:
    - not ansible_check_mode
    - ollama_run_smoke_test | bool

- name: Record the effective Ollama supplementary groups
  ansible.builtin.set_fact:
    ollama_effective_supplementary_groups: >-
      {{ ollama_effective_environment.stdout | default('')
         | regex_search('^SupplementaryGroups=(.*)$', '\1', multiline=True)
         | default([''], true) | first | trim | split() }}
  changed_when: false
  when:
    - not ansible_check_mode
    - ollama_run_smoke_test | bool

- name: Confirm the systemd drop-in is in effect
  ansible.builtin.assert:
    that:
      - >-
        ('OLLAMA_MODELS=' + ollama_models_dir) in
        (ollama_effective_environment.stdout | default(''))
      - >-
        (ollama_gpu_groups_present
         | difference(ollama_effective_supplementary_groups)) | length == 0
    fail_msg: >-
      The Ollama systemd drop-in is not in effect: OLLAMA_MODELS={{ ollama_models_dir }}
      was not found in `systemctl show {{ ollama_service }} --property=Environment`,
      or the expected SupplementaryGroups ({{ ollama_gpu_groups_present | join(' ') }})
      were not all present in the observed SupplementaryGroups
      ({{ ollama_effective_supplementary_groups | join(' ') }}).
  when:
    - not ansible_check_mode
    - ollama_run_smoke_test | bool

- name: Resolve the escaped systemd mount unit name for the model storage root
  ansible.builtin.command:
    argv:
      - systemd-escape
      - --path
      - --suffix=mount
      - "{{ ollama_models_root }}"
  register: ollama_models_root_mount_unit
  changed_when: false
  check_mode: false
  when:
    - not ansible_check_mode
    - ollama_run_smoke_test | bool

- name: Read the effective Ollama mount dependency configuration
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - "{{ ollama_service }}"
      - --property=RequiresMountsFor
      - --property=After
      - --property=Requires
  become: true
  register: ollama_effective_mount_dependency
  changed_when: false
  check_mode: false
  when:
    - not ansible_check_mode
    - ollama_run_smoke_test | bool

- name: Record the escaped mount unit name for the model storage root
  ansible.builtin.set_fact:
    ollama_models_root_mount_unit_name: "{{ ollama_models_root_mount_unit.stdout | default('') | trim }}"
  changed_when: false
  when:
    - not ansible_check_mode
    - ollama_run_smoke_test | bool

- name: Confirm the mount dependency reached the effective configuration
  ansible.builtin.assert:
    that:
      - >-
        ollama_models_root in
        (ollama_effective_mount_dependency.stdout | default(''))
      - >-
        ollama_models_root_mount_unit_name in
        (ollama_effective_mount_dependency.stdout | default(''))
      - ollama_models_root_mount_unit_name | length > 0
    fail_msg: >-
      {{ ollama_models_root }} and/or the escaped mount unit name
      {{ ollama_models_root_mount_unit_name }} were not both found, as
      substrings, in the combined stdout of `systemctl show
      {{ ollama_service }} --property=RequiresMountsFor
      --property=After --property=Requires`. Observed:
      {{ ollama_effective_mount_dependency.stdout | default('') }}
  when:
    - not ansible_check_mode
    - ollama_run_smoke_test | bool

- name: Read the effective Ollama unit file, including drop-ins
  ansible.builtin.command:
    argv:
      - systemctl
      - cat
      - "{{ ollama_service }}"
  become: true
  register: ollama_effective_unit_file
  changed_when: false
  check_mode: false
  when:
    - not ansible_check_mode
    - ollama_run_smoke_test | bool

- name: Confirm ConditionPathIsMountPoint reached the effective unit file
  ansible.builtin.assert:
    that:
      - >-
        ('ConditionPathIsMountPoint=' + ollama_models_root) in
        (ollama_effective_unit_file.stdout | default(''))
    fail_msg: >-
      ConditionPathIsMountPoint={{ ollama_models_root }} was not found in
      `systemctl cat {{ ollama_service }}`. systemctl show does not expose
      Condition* directives at all (ConditionResult=yes is also reported
      for units with no conditions), so this is the only check that
      confirms the drop-in's ConditionPathIsMountPoint line actually
      reached the manager. Observed:
      {{ ollama_effective_unit_file.stdout | default('') }}
  when:
    - not ansible_check_mode
    - ollama_run_smoke_test | bool

- name: Confirm the base Ollama unit file reached the effective configuration
  ansible.builtin.assert:
    that:
      - >-
        ('# ' ~ ollama_unit_path) in
        (ollama_effective_unit_file.stdout | default(''))
    fail_msg: >-
      `# {{ ollama_unit_path }}` was not found in `systemctl cat
      {{ ollama_service }}`, meaning systemd is not sourcing the base unit
      this role wrote.
      Observed: {{ ollama_effective_unit_file.stdout | default('') }}
  when:
    - not ansible_check_mode
    - ollama_run_smoke_test | bool

- name: Verify the effective Ollama unit for silently ignored directives
  ansible.builtin.command:
    argv:
      - systemd-analyze
      - verify
      - "{{ ollama_service }}"
  become: true
  register: ollama_unit_verify
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - not ansible_check_mode
    - ollama_run_smoke_test | bool

- name: Confirm no directive in the drop-in was silently ignored by systemd
  ansible.builtin.assert:
    that:
      - (ollama_unit_verify.rc | default(1)) == 0
      - "'Unknown key' not in (ollama_unit_verify.stdout | default(''))"
      - "'Unknown key' not in (ollama_unit_verify.stderr | default(''))"
    fail_msg: >-
      `systemd-analyze verify {{ ollama_service }}` either exited non-zero
      or reported an "Unknown key" warning. The exit code is checked
      because the task runs with failed_when: false, so that this assert
      can report the command's own output; without it a future fatal error
      that does not happen to contain the string "Unknown key" would be
      treated as success. The warning is checked because systemd silently
      ignores unrecognized keys in a [Unit]/[Service] section rather than
      failing, so a typo in the drop-in (for example
      ConditionPathIsMountPoin=) would otherwise pass every other check in
      this file while providing no actual protection.
      rc: {{ ollama_unit_verify.rc | default('n/a') }}
      stdout: {{ ollama_unit_verify.stdout | default('') }}
      stderr: {{ ollama_unit_verify.stderr | default('') }}
  when:
    - not ansible_check_mode
    - ollama_run_smoke_test | bool

- name: Query the Ollama API for its version
  ansible.builtin.uri:
    url: "{{ ollama_api_url }}"
    return_content: true
  register: ollama_api_version
  retries: "{{ ollama_smoke_test_retries }}"
  delay: "{{ ollama_smoke_test_delay }}"
  until: ollama_api_version is success
  changed_when: false
  check_mode: false
  when:
    - not ansible_check_mode
    - ollama_run_smoke_test | bool
    - ollama_manage_service | bool

- name: Confirm the Ollama API reported the desired version
  ansible.builtin.assert:
    that:
      - "'version' in (ollama_api_version.json | default({}))"
      - (ollama_api_version.json | default({})).version | default('') == ollama_desired_version
    fail_msg: >-
      The Ollama API at {{ ollama_api_url }} did not return a `version`
      field, or it did not match the desired version
      {{ ollama_desired_version }}. Observed:
      {{ (ollama_api_version.json | default({})).version | default('none') }}
  when:
    - not ansible_check_mode
    - ollama_run_smoke_test | bool
    - ollama_manage_service | bool

- name: Report the observed Ollama version
  ansible.builtin.debug:
    msg: >-
      Ollama API reports version {{ (ollama_api_version.json | default({})).version | default('unknown') }}.
      A successful API response proves the service runs; it does NOT prove
      GPU acceleration is in use. Confirm the GPU backend selection from
      `journalctl -u {{ ollama_service }}`.
  when:
    - not ansible_check_mode
    - ollama_run_smoke_test | bool
    - ollama_manage_service | bool
