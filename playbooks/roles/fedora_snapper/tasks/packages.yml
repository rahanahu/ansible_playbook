---
- name: Install Snapper
  ansible.builtin.dnf:
    name:
      - snapper
    state: present
  become: true
  when: >-
    fedora_install_snapper | bool or
    fedora_snapper_create_root_config | bool or
    fedora_snapper_create_baseline_snapshot | bool

- name: Install Btrfs Assistant
  ansible.builtin.dnf:
    name:
      - btrfs-assistant
    state: present
  become: true
  when: >-
    fedora_install_snapper_gui | bool and
    (fedora_install_snapper | bool or
     fedora_snapper_create_root_config | bool or
     fedora_snapper_create_baseline_snapshot | bool)
