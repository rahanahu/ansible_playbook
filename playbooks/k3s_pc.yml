---
- name: Provision a k3s single-node host
  hosts: localhost
  connection: local
  gather_facts: true
  pre_tasks:
    - name: Resolve the workstation target user
      ansible.builtin.import_role:
        name: target_user
      tags:
        - always
  roles:
    - role: zsh
    - role: docker
      when: ansible_facts['system'] != 'Darwin'
    - role: k3s
    - role: helm
