---
- name: Install Snapper packages
  ansible.builtin.import_tasks:
    file: packages.yml

- name: Create and validate the root Snapper configuration
  ansible.builtin.import_tasks:
    file: config.yml
  when: >-
    fedora_snapper_create_root_config | bool or
    fedora_snapper_create_baseline_snapshot | bool

- name: Apply the root Snapper retention configuration
  ansible.builtin.import_tasks:
    file: retention.yml
  when: >-
    fedora_snapper_manage_retention | bool and
    fedora_snapper_root_config_present | bool

- name: Enable and start the Snapper timers
  ansible.builtin.import_tasks:
    file: timers.yml
  when: >-
    fedora_snapper_manage_timers | bool and
    fedora_snapper_root_config_present | bool

- name: Create the baseline Snapper snapshot
  ansible.builtin.import_tasks:
    file: baseline.yml
  when: fedora_snapper_create_baseline_snapshot | bool
