---
- name: Manage the Fedora Btrfs subvolume layout
  hosts: localhost
  connection: local
  gather_facts: true

  pre_tasks:
    - name: Validate the Fedora release
      ansible.builtin.import_role:
        name: fedora_preflight
        tasks_from: release
      tags:
        - always
        - preflight

    - name: Resolve the target user for rootless Podman storage
      ansible.builtin.include_role:
        name: target_user
      vars:
        target_user_allow_root: false
      when: fedora_btrfs_layout_podman_rootless | bool
      tags:
        - always
        - preflight

  tasks:
    - name: Manage opted-in Btrfs subvolumes
      ansible.builtin.import_role:
        name: fedora_btrfs_layout
      tags:
        - btrfs
        - layout
