---
- name: Require the nvm target user
  ansible.builtin.assert:
    that:
      - target_user is defined
      - target_home is defined
      - target_user != 'root' or nvm_allow_root | bool
    fail_msg: >-
      Resolve target_user and target_home before the nvm role. Root is allowed
      only when nvm_allow_root=true for an explicit server profile.
  tags:
    - user

- name: Check whether nvm is installed for the target user
  ansible.builtin.stat:
    path: "{{ target_home }}/.nvm/nvm.sh"
  register: nvm_install
  tags:
    - user

- name: Create the target user Ansible cache directory
  ansible.builtin.file:
    path: "{{ target_home }}/.cache/ansible"
    state: directory
    mode: "0700"
  become: "{{ ansible_facts['user_id'] != target_user }}"
  become_user: "{{ target_user }}"
  when: not nvm_install.stat.exists
  tags:
    - user

- name: Download the pinned nvm installer
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh
    dest: "{{ target_home }}/.cache/ansible/nvm-install.sh"
    mode: "0700"
  become: "{{ ansible_facts['user_id'] != target_user }}"
  become_user: "{{ target_user }}"
  when: not nvm_install.stat.exists
  tags:
    - user

- name: Install nvm for the target user
  ansible.builtin.command:
    argv:
      - "{{ target_home }}/.cache/ansible/nvm-install.sh"
  become: "{{ ansible_facts['user_id'] != target_user }}"
  become_user: "{{ target_user }}"
  environment:
    PROFILE: /dev/null
    NVM_DIR: "{{ target_home }}/.nvm"
    HOME: "{{ target_home }}"
  when: not nvm_install.stat.exists
  tags:
    - user

- name: Ensure the target user zsh init directory exists
  ansible.builtin.file:
    path: "{{ target_home }}/.local/share/zsh/init.d"
    state: directory
    mode: "0755"
  become: "{{ ansible_facts['user_id'] != target_user }}"
  become_user: "{{ target_user }}"
  tags:
    - user

- name: Deploy the target user nvm zsh snippet
  ansible.builtin.copy:
    dest: "{{ target_home }}/.local/share/zsh/init.d/nvm.sh"
    content: |
      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
      [ -s "$NVM_DIR/bash_completion" ] && . "$NVM_DIR/bash_completion"
    mode: "0644"
  become: "{{ ansible_facts['user_id'] != target_user }}"
  become_user: "{{ target_user }}"
  tags:
    - user

- name: Configure nvm in the target user bash profile
  ansible.builtin.blockinfile:
    path: "{{ target_home }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED NVM"
    create: true
    block: |
      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
      [ -s "$NVM_DIR/bash_completion" ] && . "$NVM_DIR/bash_completion"
    mode: "0644"
  become: "{{ ansible_facts['user_id'] != target_user }}"
  become_user: "{{ target_user }}"
  tags:
    - user

- name: Install and select Node.js LTS after installing nvm
  ansible.builtin.shell: |
    . "$NVM_DIR/nvm.sh"
    nvm install --lts
    nvm use --lts
  args:
    executable: /bin/bash
  become: "{{ ansible_facts['user_id'] != target_user }}"
  become_user: "{{ target_user }}"
  environment:
    NVM_DIR: "{{ target_home }}/.nvm"
    HOME: "{{ target_home }}"
  when: not nvm_install.stat.exists
  tags:
    - user
