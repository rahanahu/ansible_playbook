---
- name: Check if nvm is installed
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.nvm/nvm.sh"
  register: nvm_install

- name: Download nvm install script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh
    dest: /tmp/nvm_install.sh
    mode: "0700"
  when: not nvm_install.stat.exists

- name: Run nvm install script
  ansible.builtin.command: /tmp/nvm_install.sh
  environment:
    PROFILE: /dev/null
    NVM_DIR: "{{ ansible_user_dir }}/.nvm"
    HOME: "{{ ansible_user_dir }}"
  when: not nvm_install.stat.exists

- name: Ensure zsh init.d directory exists
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.local/share/zsh/init.d"
    state: directory
    owner: "{{ ansible_user_id }}"
    mode: "0755"

- name: Deploy nvm init snippet for zsh
  ansible.builtin.copy:
    dest: "{{ ansible_user_dir }}/.local/share/zsh/init.d/nvm.sh"
    content: |
      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
      [ -s "$NVM_DIR/bash_completion" ] && . "$NVM_DIR/bash_completion"
    owner: "{{ ansible_user_id }}"
    mode: "0644"

- name: Ensure nvm init lines exist in .bashrc
  ansible.builtin.blockinfile:
    path: "{{ ansible_user_dir }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED NVM"
    create: true
    block: |
      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
      [ -s "$NVM_DIR/bash_completion" ] && . "$NVM_DIR/bash_completion"
    owner: "{{ ansible_user_id }}"
    mode: "0644"

- name: Install and select Node.js LTS on first nvm install
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
    nvm install --lts
    nvm use --lts
  args:
    executable: /bin/bash
  environment:
    HOME: "{{ ansible_user_dir }}"
  when: not nvm_install.stat.exists
