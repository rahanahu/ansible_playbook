---
# Helm is pinned rather than latest-following, so cluster tooling versions do
# not move under the user without an explicit change. Bumping helm_version
# means updating helm_archive_checksum too; take the checksum from
# https://get.helm.sh/<archive>.sha256sum for the matching release.
helm_version: v4.2.4
helm_archive_checksum: sha256:c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3
helm_install_dir: /usr/local/bin
