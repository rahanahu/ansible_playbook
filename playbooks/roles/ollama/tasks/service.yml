---
- name: Enable and start the Ollama service
  ansible.builtin.systemd_service:
    name: "{{ ollama_service }}"
    enabled: "{{ ollama_service_enabled | bool }}"
    state: "{{ ollama_service_state }}"
    daemon_reload: false
  become: true
  when:
    - ollama_manage_service | bool
    - (not ansible_check_mode) or (ollama_unit_path_stat.stat.exists | default(false))
