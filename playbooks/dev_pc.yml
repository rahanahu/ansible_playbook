---
- hosts: localhost
  connection: local
  gather_facts: true
  pre_tasks:
    - name: Resolve the workstation target user
      ansible.builtin.import_role:
        name: target_user
      tags:
        - always
  roles:
    - role: docker
      when: ansible_facts['system'] != 'Darwin'
    - role: uv
    - role: zsh
    - role: nvm
