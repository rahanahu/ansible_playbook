---
- name: Validate the Fedora release
  ansible.builtin.import_tasks: release.yml
  tags:
    - always
    - preflight

- name: Reject containers from the workstation system baseline
  ansible.builtin.assert:
    that:
      - >-
        ansible_facts['virtualization_role'] != 'guest' or
        ansible_facts['virtualization_type'] not in
        fedora_container_virtualization_types
    fail_msg: |-
      Detected a container guest (type={{ ansible_facts['virtualization_type'] }},
      role={{ ansible_facts['virtualization_role'] }}).

      This playbook targets bare-metal Fedora or a full virtual machine.
      {% if ansible_facts['virtualization_type'] == 'lxc' %}
      Run instead:

        ansible-playbook playbooks/fedora_lxc.yml -i localhost, -c local
      {% else %}
      No workstation baseline is provided for this container type.
      {% endif %}
  tags:
    - always
    - preflight

- name: Read SELinux enforcement mode
  ansible.builtin.command:
    argv:
      - getenforce
  register: fedora_selinux_mode
  changed_when: false
  failed_when: false
  when: fedora_require_security_baseline | bool

- name: Read firewalld state
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - firewalld
  register: fedora_firewalld_state
  changed_when: false
  failed_when: false
  when: fedora_require_security_baseline | bool

- name: Require SELinux and firewalld baseline
  ansible.builtin.assert:
    that:
      - fedora_selinux_mode.stdout | trim == 'Enforcing'
      - fedora_firewalld_state.stdout | trim == 'active'
    fail_msg: >-
      SELinux must be Enforcing and firewalld must be active. The playbook does
      not enable or weaken either security control automatically.
  when: fedora_require_security_baseline | bool
