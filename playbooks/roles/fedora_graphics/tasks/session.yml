---
- name: Detect graphics hardware for a session-only run
  ansible.builtin.include_tasks:
    file: detect.yml
    apply:
      tags:
        - session
        - graphics
  when: fedora_graphics_has_amd is not defined
  tags:
    - session
    - graphics

- name: Read OpenGL renderer information in the workstation session
  ansible.builtin.command:
    argv:
      - glxinfo
      - -B
  register: fedora_glxinfo
  changed_when: false
  failed_when: false
  when:
    - fedora_has_user_session | default(false) | bool
    - lookup('ansible.builtin.env', 'DISPLAY') | length > 0

- name: Require available OpenGL renderer information
  ansible.builtin.assert:
    that:
      - fedora_glxinfo.rc == 0
    fail_msg: >-
      glxinfo could not read renderer information from the active workstation
      session.
  when:
    - fedora_graphics_strict_checks | bool
    - fedora_has_user_session | default(false) | bool
    - lookup('ansible.builtin.env', 'DISPLAY') | length > 0

- name: Require AMD as the active session renderer when explicitly requested
  ansible.builtin.assert:
    that:
      - >-
        (fedora_glxinfo.stdout | regex_search('(?i)(AMD|Radeon)')) is not none
      - "'llvmpipe' not in (fedora_glxinfo.stdout | lower)"
    fail_msg: >-
      An AMD GPU is present, but the active OpenGL session renderer is not AMD
      hardware. Disable fedora_graphics_require_amd_session_renderer for an
      intentional mixed-GPU renderer selection.
  when:
    - fedora_graphics_strict_checks | bool
    - fedora_graphics_require_amd_session_renderer | bool
    - fedora_graphics_has_amd | bool
    - fedora_has_user_session | default(false) | bool
    - lookup('ansible.builtin.env', 'DISPLAY') | length > 0
