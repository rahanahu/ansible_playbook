---
- name: Provision the local AI environment
  hosts: localhost
  connection: local
  gather_facts: true

  # The overall Fedora workstation / Btrfs provisioning baseline is
  # validated on Fedora 44. Ollama itself is installed from the upstream
  # release and no longer depends on Fedora's ollama RPM topology.
  vars:
    fedora_strict_release_check: true

  pre_tasks:
    - name: Validate the Fedora release
      ansible.builtin.import_role:
        name: fedora_preflight
        tasks_from: release
      tags:
        - always
        - preflight

  tasks:
    - name: Place the AI model storage on its own Btrfs subvolume
      ansible.builtin.import_role:
        name: fedora_btrfs_layout
      vars:
        fedora_btrfs_layout_ai_models: true
      tags:
        - ai
        - btrfs
        - layout

    - name: Install and configure Ollama
      ansible.builtin.import_role:
        name: ollama
      tags:
        - ai
        - ollama
