---
- name: Reload systemd for the Ollama units
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true
  when: not ansible_check_mode

- name: Restart Ollama
  ansible.builtin.systemd_service:
    name: "{{ ollama_service }}"
    state: restarted
  become: true
  when:
    - not ansible_check_mode
    - ollama_manage_service | bool
