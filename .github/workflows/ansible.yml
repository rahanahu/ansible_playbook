---
name: ansible

"on":
  push:
    branches: [main, zsh]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install tooling
        run: python -m pip install --upgrade pip ansible-core ansible-lint yamllint
      - name: Show tool versions
        run: |
          ansible --version
          ansible-lint --version
          yamllint --version
      - name: Check whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
      - name: yamllint
        run: yamllint .
      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: ansible-lint
        run: ansible-lint
      - name: Syntax check canonical entrypoints
        run: |
          for p in fedora_workstation fedora_system fedora_lxc user zsh hazkey dev_pc k3s_pc; do
            ansible-playbook "playbooks/$p.yml" -i localhost, -c local --syntax-check
          done
