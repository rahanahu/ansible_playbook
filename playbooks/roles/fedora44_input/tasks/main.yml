---
- name: Install Fcitx5 and Mozc packages
  ansible.builtin.dnf:
    name:
      - fcitx5
      - fcitx5-configtool
      - kcm-fcitx5
      - fcitx5-qt
      - fcitx5-qt6
      - fcitx5-mozc
    state: present
  become: true

- name: Create the per-user environment directory
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/environment.d"
    state: directory
    owner: "{{ ansible_user_id }}"
    mode: "0755"

- name: Configure XMODIFIERS for Fcitx5 and XWayland
  ansible.builtin.copy:
    dest: "{{ ansible_user_dir }}/.config/environment.d/90-fcitx5.conf"
    content: |
      XMODIFIERS=@im=fcitx
    owner: "{{ ansible_user_id }}"
    mode: "0644"
