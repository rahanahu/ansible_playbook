---
- name: Ensure the Ollama service group exists
  ansible.builtin.group:
    name: "{{ ollama_service_group }}"
    system: true
    state: present
  become: true

# uid and comment are intentionally not set: this host's existing ollama
# account (uid 968, GECOS "Runs Ollama") predates this role and must not be
# disturbed, so the module only asserts the properties this role actually
# depends on. move_home is also intentionally left unset so an existing
# home directory's contents are never relocated.
- name: Ensure the Ollama service user exists
  ansible.builtin.user:
    name: "{{ ollama_service_user }}"
    group: "{{ ollama_service_group }}"
    home: "{{ ollama_service_home }}"
    create_home: true
    shell: /sbin/nologin
    system: true
    state: present
  become: true
