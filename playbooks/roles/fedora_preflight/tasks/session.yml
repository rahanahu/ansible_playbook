---
- name: Read the invoking shell session
  ansible.builtin.set_fact:
    fedora_session_type: >-
      {{ lookup('ansible.builtin.env', 'XDG_SESSION_TYPE') | lower }}
    fedora_current_desktop: >-
      {{ lookup('ansible.builtin.env', 'XDG_CURRENT_DESKTOP') | lower }}
    fedora_has_user_session: >-
      {{ ansible_facts['user_id'] == target_user and
         lookup('ansible.builtin.env', 'XDG_SESSION_TYPE') | length > 0 }}
  changed_when: false

- name: Require KDE Plasma on Wayland when a user session is available
  ansible.builtin.assert:
    that:
      - fedora_session_type == 'wayland'
      - >-
        'kde' in fedora_current_desktop or
        'plasma' in fedora_current_desktop
    fail_msg: >-
      The expected session is KDE Plasma on Wayland; detected session={{
      fedora_session_type | default('') }}, desktop={{
      fedora_current_desktop | default('') }}.
  when:
    - fedora_require_kde_wayland | bool
    - fedora_has_user_session | bool
