---
# Helm is pinned rather than latest-following, so cluster tooling versions do
# not move under the user without an explicit change. Bumping helm_version
# means updating helm_archive_checksums too; take each checksum from
# https://get.helm.sh/<archive>.sha256sum for the matching release and
# architecture.
helm_version: v4.2.4
helm_archive_checksums:
  amd64: sha256:c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3
  arm64: sha256:564de2191b881e9f71b5606b25345821ea1682f06ab90499d3ab22b530176da1
helm_install_dir: /usr/local/bin
