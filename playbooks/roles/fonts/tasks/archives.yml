---
# unzip extracts the archives, and fontconfig provides the fc-cache the
# handler runs afterwards. Both belong here rather than with the font
# packages: they are only needed on this path, and a minimal host that
# installs no font packages at all still needs them.
- name: Install the font archive prerequisites on RedHat-family systems
  ansible.builtin.dnf:
    name:
      - unzip
      - fontconfig
    state: present
  become: true
  when: ansible_facts['os_family'] == 'RedHat'
  tags:
    - system
    - fonts

- name: Install the font archive prerequisites on Debian-family systems
  ansible.builtin.apt:
    name:
      - unzip
      - fontconfig
    state: present
    update_cache: true
  become: true
  when: ansible_facts['os_family'] == 'Debian'
  tags:
    - system
    - fonts

# UDEV Gothic (Nerd Font build) -----------------------------------------

- name: Look up the latest UDEV Gothic release
  ansible.builtin.uri:
    url: https://api.github.com/repos/yuru7/udev-gothic/releases/latest
    return_content: true
  register: fonts_udev_gothic_release_lookup
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - fonts_install_udev_gothic | bool
    - fonts_udev_gothic_version is not defined
  tags:
    - system
    - fonts

- name: Check for an existing UDEV Gothic install marker
  ansible.builtin.stat:
    path: "{{ fonts_install_dir }}/udev-gothic/.fonts-version"
  register: fonts_udev_gothic_marker_stat
  tags:
    - system
    - fonts

- name: Read the existing UDEV Gothic install marker
  ansible.builtin.slurp:
    src: "{{ fonts_install_dir }}/udev-gothic/.fonts-version"
  register: fonts_udev_gothic_marker_content
  when: fonts_udev_gothic_marker_stat.stat.exists
  tags:
    - system
    - fonts

- name: Resolve the effective UDEV Gothic version
  ansible.builtin.set_fact:
    fonts_udev_gothic_version_effective: >-
      {{ fonts_udev_gothic_version
         | default(fonts_udev_gothic_release_lookup.json.tag_name
                    if ((fonts_udev_gothic_release_lookup.status | default(0)) == 200 and
                        not (fonts_udev_gothic_release_lookup.json.prerelease | default(true)))
                    else '') }}
    fonts_udev_gothic_installed_version: >-
      {{ (fonts_udev_gothic_marker_content.content | b64decode | trim)
         if fonts_udev_gothic_marker_stat.stat.exists
         else '' }}
  changed_when: false
  tags:
    - system
    - fonts

- name: Warn that the installed UDEV Gothic version is being kept
  ansible.builtin.debug:
    msg: >-
      Could not resolve the latest UDEV Gothic release from the GitHub API.
      Keeping whatever is currently installed at
      {{ fonts_install_dir }}/udev-gothic unchanged, if anything is
      installed there at all. Set fonts_udev_gothic_version
      explicitly to pin a version and avoid this lookup.
  when:
    - fonts_install_udev_gothic | bool
    - fonts_udev_gothic_version_effective | length == 0
  tags:
    - system
    - fonts

- name: Manage the UDEV Gothic font archive
  become: true
  when:
    - fonts_install_udev_gothic | bool
    - fonts_udev_gothic_version_effective | length > 0
    - fonts_udev_gothic_version_effective != fonts_udev_gothic_installed_version
  tags:
    - system
    - fonts
  block:
    - name: Create a temporary directory for the UDEV Gothic archive
      ansible.builtin.tempfile:
        state: directory
        prefix: fonts-udev-gothic-
      register: fonts_udev_gothic_tmp

    - name: Download the UDEV Gothic release archive
      vars:
        font_version: "{{ fonts_udev_gothic_version_effective }}"
      ansible.builtin.get_url:
        url: >-
          {{ 'https://github.com/yuru7/udev-gothic/releases/download/' ~
             font_version ~ '/UDEVGothic_NF_' ~ font_version ~ '.zip' }}
        dest: "{{ fonts_udev_gothic_tmp.path }}/UDEVGothic_NF.zip"
        mode: "0644"

    - name: Extract the UDEV Gothic release archive
      ansible.builtin.unarchive:
        src: "{{ fonts_udev_gothic_tmp.path }}/UDEVGothic_NF.zip"
        dest: "{{ fonts_udev_gothic_tmp.path }}"
        remote_src: true

    - name: Find the extracted UDEV Gothic font files
      ansible.builtin.find:
        paths: "{{ fonts_udev_gothic_tmp.path }}"
        patterns:
          - "*.ttf"
        recurse: true
      register: fonts_udev_gothic_found_fonts

    - name: Recreate the UDEV Gothic install directory
      ansible.builtin.file:
        path: "{{ fonts_install_dir }}/udev-gothic"
        state: "{{ fonts_udev_gothic_dir_state_item }}"
        mode: "0755"
      loop:
        - absent
        - directory
      loop_control:
        loop_var: fonts_udev_gothic_dir_state_item

    - name: Install the UDEV Gothic font files
      ansible.builtin.copy:
        src: "{{ fonts_udev_gothic_font_item.path }}"
        dest: "{{ fonts_install_dir }}/udev-gothic/{{ fonts_udev_gothic_font_item.path | basename }}"
        remote_src: true
        mode: "0644"
      loop: "{{ fonts_udev_gothic_found_fonts.files }}"
      loop_control:
        label: "{{ fonts_udev_gothic_font_item.path | basename }}"
        loop_var: fonts_udev_gothic_font_item
      notify:
        - Refresh the font cache
        - Restore SELinux context for installed fonts

    - name: Record the installed UDEV Gothic version
      ansible.builtin.copy:
        content: "{{ fonts_udev_gothic_version_effective }}"
        dest: "{{ fonts_install_dir }}/udev-gothic/.fonts-version"
        mode: "0644"

    - name: Remove the temporary UDEV Gothic archive directory
      ansible.builtin.file:
        path: "{{ fonts_udev_gothic_tmp.path }}"
        state: absent

# HackGen (standard build, not the Nerd Font Console-only build) --------

