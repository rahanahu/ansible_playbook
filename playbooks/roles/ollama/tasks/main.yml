---
- name: Validate the Ollama storage and Btrfs prerequisites
  ansible.builtin.import_tasks:
    file: preflight.yml

- name: Remove the Fedora Ollama package and install archive prerequisites
  ansible.builtin.import_tasks:
    file: packages.yml

- name: Ensure the Ollama service account exists
  ansible.builtin.import_tasks:
    file: account.yml

- name: Install or upgrade the upstream Ollama release binary
  ansible.builtin.import_tasks:
    file: install.yml

- name: Write the base Ollama systemd unit
  ansible.builtin.import_tasks:
    file: unit.yml

- name: Create the Ollama model storage directory
  ansible.builtin.import_tasks:
    file: storage.yml

- name: Configure the Ollama systemd drop-in
  ansible.builtin.import_tasks:
    file: configure.yml

- name: Enable and start the Ollama service
  ansible.builtin.import_tasks:
    file: service.yml

- name: Verify the running Ollama service
  ansible.builtin.import_tasks:
    file: verify.yml
