---
- name: Reload systemd after the Ollama drop-in changes
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

- name: Restart Ollama after the drop-in changes
  ansible.builtin.systemd_service:
    name: "{{ ollama_service }}"
    state: restarted
  become: true
  when: ollama_manage_service | bool
